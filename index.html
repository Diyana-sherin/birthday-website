<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Scrapbook</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
overflow:hidden;height:100vh;font-family:Poppins,sans-serif;
background:linear-gradient(-45deg,#ffd6e7,#eadcff,#fff4dd,#f4dfc8);
background-size:400% 400%;
animation:bg 15s ease infinite;
position:relative;
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.center{
position:absolute;left:50%;top:50%;
transform:translate(-50%,-50%);
width:min(500px,85vw);
padding:25px;
text-align:center;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,.15);
z-index:10;
}
h1{
font-family:'Great Vibes',cursive;
font-size:clamp(3rem,6vw,4.5rem);
color:white;
text-shadow:0 0 20px gold;
}
p{color:white}

.polaroid{
position:absolute;
background:white;
padding:10px 10px 35px;
border-radius:4px;
box-shadow:0 8px 20px rgba(0,0,0,.25);
transition:.4s;
}
.polaroid img{width:100%;display:block}
.polaroid:hover,
.polaroid:active{
    transform:scale(1.25) rotate(0deg) translateY(-15px) !important;
    z-index:9999;
    box-shadow:0 25px 60px rgba(0,0,0,0.4);
}

.p1{width:170px;left:3%;top:5%;transform:rotate(-12deg)}
.p2{width:200px;left:20%;top:12%;transform:rotate(10deg)}
.p3{width:180px;right:5%;top:8%;transform:rotate(-8deg)}
.p4{width:160px;right:25%;top:20%;transform:rotate(12deg)}
.p5{width:180px;left:8%;bottom:18%;transform:rotate(8deg)}
.p6{width:220px;left:25%;bottom:5%;transform:rotate(-10deg)}
.p7{width:180px;right:8%;bottom:15%;transform:rotate(10deg)}
.p8{width:220px;right:25%;bottom:3%;transform:rotate(-8deg)}

.sticker{
position:absolute;
font-size:2rem;
animation:float 4s ease-in-out infinite;
z-index:15;
}
@keyframes float{50%{transform:translateY(-10px)}}

.s1{top:8%;left:45%}
.s2{top:18%;right:18%}
.s3{bottom:22%;left:15%}
.s4{bottom:15%;right:15%}
.s5{top:70%;left:6%}
.s6{top:75%;right:8%}
.s7{top:40%;right:6%}

.note{
position:absolute;
background:#fff8d8;
padding:10px 15px;
border-radius:8px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
font-size:14px;
z-index:10;
}
.n1{left:8%;top:45%;transform:rotate(-8deg)}
.n2{right:10%;top:48%;transform:rotate(6deg)}
.n3{left:40%;bottom:12%;transform:rotate(-3deg)}

.music{
position:fixed;bottom:20px;right:20px;
width:60px;height:60px;border:none;border-radius:50%;
background:rgba(255,255,255,.2);
backdrop-filter:blur(10px);
font-size:22px;cursor:pointer;
}

.particle{
position:absolute;
background:rgba(255,255,255,.6);
border-radius:50%;
animation:rise linear infinite;
}
@keyframes rise{
from{transform:translateY(100vh)}
to{transform:translateY(-100px)}
}

.footer{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
color:white;
}

.polaroid{
    cursor:pointer;
    transition:
        transform .45s ease,
        box-shadow .45s ease;
}


</style>
</head>
<body>

<div class="polaroid p1"><img src="Adhi1.jpg"></div>
<div class="polaroid p2"><img src="Adhi9.jpg"></div>
<div class="polaroid p3"><img src="Adhi3.jpeg"></div>
<div class="polaroid p4"><img src="Adhi4.jpeg"></div>
<div class="polaroid p5"><img src="Adhi5.jpg"></div>
<div class="polaroid p6"><img src="Adhi2.jpg"></div>
<div class="polaroid p7"><img src="Adhil3.jpg"></div>
<div class="polaroid p8"><img src="Adhi8.jpg"></div>

<div class="sticker s1">💖</div>
<div class="sticker s2">⭐</div>
<div class="sticker s3">🎂</div>
<div class="sticker s4">🎁</div>
<div class="sticker s5">🌸</div>
<div class="sticker s6">✨</div>
<div class="sticker s7">🧸</div>


<div class="note n3">Another Beautiful  Year 🎉</div>

<div class="center">
<h1>Happy Birthday</h1>
<p>Happy 23✨</p>
</div>

<audio id="bgm" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" id="btn">▶</button>
<div class="footer">Made with Love ❤️</div>

<script>
for(let i=0;i<60;i++){
 let p=document.createElement('div');
 p.className='particle';
 let s=Math.random()*5+2;
 p.style.width=s+'px';
 p.style.height=s+'px';
 p.style.left=Math.random()*100+'vw';
 p.style.animationDuration=(Math.random()*10+8)+'s';
 document.body.appendChild(p);
}

const a=document.getElementById('bgm');
const b=document.getElementById('btn');
b.onclick=()=>{
 if(a.paused){a.play();b.innerHTML='❚❚';}
 else{a.pause();b.innerHTML='▶';}
}
</script>

</body>
</html>
